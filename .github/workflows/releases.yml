name: Release maker

on:
  workflow_dispatch

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get -y install 7zip
    - name: Download artifacts
      run: |
        run_id=$(gh run list --repo mpc-qt/mpc-qt --workflow "CI" --branch master -s "success" --limit 1 --json databaseId | jq -r '.[0].databaseId')
        if [[ -n "$run_id" ]]; then
            echo "Downloading artifacts for run ID: $run_id"

            echo "Downloading Linux build..."
            gh run download "$run_id" --repo mpc-qt/mpc-qt --name "mpc-qt-linux-x64-continuous"
            echo "Download complete!"

            echo "Downloading debug symbols..."
            gh run download "$run_id" --repo mpc-qt/mpc-qt --name "mpc-qt-linux-x64-debug_symbols-continuous"
            echo "Download complete!"

            echo "Downloading AppImage..."
            gh run download "$run_id" --repo mpc-qt/mpc-qt --name "mpc-qt-x86_64-AppImage"
            echo "Download complete!"

            # echo "Downloading AppImage zsync..."
            # gh run download "$run_id" --repo mpc-qt/mpc-qt --name "mpc-qt-x86_64-AppImage.zsync"
            echo "Download complete!"

            echo "Downloading Flatpak..."
            gh run download "$run_id" --repo mpc-qt/mpc-qt --name "mpc-qt-x86_64-Flatpak"
            echo "Download complete!"

            echo "Downloading Windows x64 portable..."
            gh run download "$run_id" --repo mpc-qt/mpc-qt --name "mpc-qt-win-x64-continuous"
            echo "Download complete!"

            echo "Downloading Windows x64 installer..."
            gh run download "$run_id" --repo mpc-qt/mpc-qt --name "mpc-qt-win-x64-installer"
            echo "Download complete!"

            echo "Downloading Windows ARM64 portable..."
            gh run download "$run_id" --repo mpc-qt/mpc-qt --name "mpc-qt-win-arm64-continuous"
            echo "Download complete!"

            echo "Downloading Windows ARM64 installer..."
            gh run download "$run_id" --repo mpc-qt/mpc-qt --name "mpc-qt-win-arm64-installer"
            echo "Download complete!"

            echo "Downloading macOS build artifact for run ID: $run_id"
            gh run download "$run_id" --repo mpc-qt/mpc-qt --name "mpc-qt-macos-arm64-continuous"
            echo "Download complete!"

            echo "Renaming and compressing artifacts..."
            mv mpc-qt-linux-x64-*.flatpak mpc-qt-linux-x64-continuous.flatpak
            7z a "mpc-qt-linux-x64-continuous.zip" "mpc-qt"
            7z a "mpc-qt-linux-x64-debug_symbols-continuous.zip" "mpc-qt.dbg"
            7z a "mpc-qt-win-x64-continuous.zip" "./mpc-qt-win-x64*"
            7z a "mpc-qt-win-arm64-continuous.zip" "./mpc-qt-win-arm64*"
            mv mpc-qt-macos-arm64.zip mpc-qt-macos-arm64-continuous.zip
        else
            echo "No recent runs found for 'CI'."
        fi

    - name: Create release and upload artifacts
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
          wget -q https://github.com/TheAssassin/pyuploadtool/releases/download/continuous/pyuploadtool-x86_64.AppImage
          chmod +x pyuploadtool-x86_64.AppImage
          ./pyuploadtool-x86_64.AppImage \
            mpc-qt-linux-x64-continuous.AppImage \
            mpc-qt-linux-x64-continuous.flatpak \
            mpc-qt-linux-x64-continuous.zip \
            mpc-qt-linux-x64-debug_symbols-continuous.zip \
            mpc-qt-win-x64-continuous.zip \
            mpc-qt-win-x64-continuous-installer.exe \
            mpc-qt-win-arm64-continuous.zip \
            mpc-qt-win-arm64-continuous-installer.exe \
            mpc-qt-macos-arm64-continuous.zip
